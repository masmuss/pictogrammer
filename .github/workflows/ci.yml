name: ci

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
        bun:
          - 1.3.14

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # ── Quality checks ──────────────────────────
      - name: Biome (lint & format)
        run: bun x biome ci .

      - name: Prettier (prettier)
        run: bun x prettier --check "src/**/*.{astro,ts,js,css}" "**/*.{md,mdx,json,yml}"

      - name: Typecheck
        run: bun run check

      - name: Unit Test
        run: bun run test:unit:run

      # ── Playwright setup ─────────────────────────────────
      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').devDependencies['@playwright/test'].replace('^','').replace('~',''))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps

      # ── Build & E2E ──────────────────────────────────────
      - name: Build website
        run: bun run build

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
