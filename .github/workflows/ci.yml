name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── BUILD & TEST ────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun binary
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-binary-1.3.14

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Pagefind index
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/pagefind
          key: ${{ runner.os }}-pagefind-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/content/**') }}
          restore-keys: |
            ${{ runner.os }}-pagefind-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-pagefind-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # ── Parallel quality checks ──────────────────────────
      - name: Lint, format, typecheck & unit tests
        run: |
          set -e
          bun run lint &                LINT=$!
          bunx biome format . &         FMT=$!
          bun run check &               CHECK=$!
          bun run test:unit:run &       UNIT=$!

          FAIL=0
          wait $LINT  || { echo "::error::Lint failed"; FAIL=1; }
          wait $FMT   || { echo "::error::Format check failed"; FAIL=1; }
          wait $CHECK || { echo "::error::Typecheck failed"; FAIL=1; }
          wait $UNIT  || { echo "::error::Unit tests failed"; FAIL=1; }

          [ $FAIL -eq 0 ] || exit 1

      # ── Playwright setup ─────────────────────────────────
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies[\"@playwright/test\"]' package.json | sed 's/[\^~]//g')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps

      # ── Build & E2E ──────────────────────────────────────
      - name: Build website
        run: bun run build

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ── SEMANTIC RELEASE ────────────────────────────────────────
  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun binary
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-binary-1.3.14

      - name: Cache Bun dependencies
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
