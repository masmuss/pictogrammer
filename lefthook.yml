# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{ts,tsx,js,jsx,astro,svelte,css,json,md,mdx}"
      run: PATH="$HOME/.bun/bin:$PATH" bun x biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    astro-check:
      glob: "*.{ts,tsx,astro}"
      run: PATH="$HOME/.bun/bin:$PATH" bun x astro check

pre-push:
  parallel: false
  commands:
    test:unit:
      run: PATH="$HOME/.bun/bin:$PATH" bun run test:unit:run
